[package]
name = "rr-flop-solve"
version = "0.1.0"
edition = "2021"
# AGPL because it links postflop-solver. Only this offline tool is AGPL; the numbers it
# writes are data, and the app itself stays MIT.
license = "AGPL-3.0-or-later"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
