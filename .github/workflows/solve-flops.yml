name: Solve flops

# Runs the offline solver (tools/flop-solve) on every flop in flops.txt for each spot, spread over
# parallel jobs, and pushes the JSON results (flop, turn and river decisions) to the gto-data branch. Not part of the app build:
# it only runs when the solver or its flop list changes on the gto-upgrade branch, or by hand.
on:
  push:
    branches: [ gto-upgrade ]
    paths: [ 'tools/flop-solve/**', '.github/workflows/solve-flops.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # single-raised pots take about 6 minutes a flop, 3-bet pots under 1
        include:
          - { spot: srp, parts: 16, part: 0 }
          - { spot: srp, parts: 16, part: 1 }
          - { spot: srp, parts: 16, part: 2 }
          - { spot: srp, parts: 16, part: 3 }
          - { spot: srp, parts: 16, part: 4 }
          - { spot: srp, parts: 16, part: 5 }
          - { spot: srp, parts: 16, part: 6 }
          - { spot: srp, parts: 16, part: 7 }
          - { spot: srp, parts: 16, part: 8 }
          - { spot: srp, parts: 16, part: 9 }
          - { spot: srp, parts: 16, part: 10 }
          - { spot: srp, parts: 16, part: 11 }
          - { spot: srp, parts: 16, part: 12 }
          - { spot: srp, parts: 16, part: 13 }
          - { spot: srp, parts: 16, part: 14 }
          - { spot: srp, parts: 16, part: 15 }
          - { spot: 3bp, parts: 4, part: 0 }
          - { spot: 3bp, parts: 4, part: 1 }
          - { spot: 3bp, parts: 4, part: 2 }
          - { spot: 3bp, parts: 4, part: 3 }
    steps:
      - uses: actions/checkout@v4
      - name: Build solver
        working-directory: tools/flop-solve
        env:
          # postflop-solver trips lints that newer compilers made errors
          RUSTFLAGS: --cap-lints=warn -C target-cpu=native
        run: cargo build --release
      - name: Solve this job's share of the flops
        working-directory: tools/flop-solve
        run: |
          mkdir -p out
          awk -v p=${{ matrix.part }} -v n=${{ matrix.parts }} '(NR - 1) % n == p' flops.txt | while read -r cls flop; do
            ./target/release/rr-flop-solve ${{ matrix.spot }} "$flop" 300 1.0 > "out/${{ matrix.spot }}-$flop.json"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: solved-${{ matrix.spot }}-${{ matrix.part }}
          path: tools/flop-solve/out/*.json

  publish:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: solved-*
          path: /tmp/solved
          merge-multiple: true
      - name: Push results to the gto-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/solved
          ls | wc -l
          echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b gto-data && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Solved flops for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gto-data
