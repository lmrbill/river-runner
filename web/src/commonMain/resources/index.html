<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="River Runner">
    <meta name="theme-color" content="#0C1310">
    <title>River Runner</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0C1310; }
        #loading { position: fixed; inset: 0; z-index: 1000; background: #0C1310; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; gap: 10px; padding: 24px; box-sizing: border-box; text-align: center;
                   color: #9DAAA2; font: 16px -apple-system, "PingFang SC", sans-serif; }
        #loading b { color: #E6B54F; font-size: 18px; }
        #diag { font-size: 12px; line-height: 1.6; color: #6f7d75; max-width: 520px; word-break: break-all; }
        #diag .err { color: #F06A63; }
    </style>
    <script>
        // Loading diagnostics: elapsed time, files being fetched, and any error, shown on the
        // loading screen so a failure on a phone can be read off a screenshot.
        (function () {
            var t0 = Date.now(), lines = [], last = "";
            function el(id) { return document.getElementById(id); }
            function render() {
                var d = el("diag"), s = el("secs");
                if (s) s.textContent = Math.round((Date.now() - t0) / 1000);
                if (d) d.innerHTML = lines.slice(-8).join("<br>") + (last ? "<br>" + last : "");
            }
            // The log is also kept in localStorage, so if the browser kills the page (white screen,
            // reload) the next visit shows where the previous one stopped.
            var prev = null;
            try { prev = JSON.parse(localStorage.getItem("rrBootLog") || "null"); } catch (e) {}
            var saved = [], booted = false;
            function save(msg) {
                saved.push(Math.round((Date.now() - t0) / 1000) + "s " + msg);
                try { localStorage.setItem("rrBootLog", JSON.stringify({ ready: booted, at: t0, lines: saved.slice(-12) })); } catch (e) {}
            }
            window.__rrLog = function (msg, isErr) {
                lines.push(isErr ? '<span class="err">' + msg + "</span>" : msg); save(msg); render();
            };
            window.addEventListener("error", function (e) {
                var t = e.target;
                if (t && (t.src || t.href)) __rrLog("加载失败: " + (t.src || t.href).split("/").pop(), true);
                else __rrLog("错误: " + (e.message || e), true);
            }, true);
            window.addEventListener("unhandledrejection", function (e) {
                __rrLog("错误: " + (e.reason && (e.reason.message || e.reason)), true);
            });
            // Report each download with its byte progress. fetch() resolves as soon as the headers
            // arrive, so the body is counted separately: a slow network then shows up as a slow
            // download instead of looking like a slow Wasm compile.
            var downloads = {};
            function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB"; }
            function progressLine() {
                var parts = [];
                for (var k in downloads) {
                    var d = downloads[k];
                    if (!d.done) parts.push(k.slice(0, 10) + " " + kb(d.got) + (d.total ? " / " + kb(d.total) : ""));
                }
                last = parts.length ? "正在下载 " + parts.join("，") : "";
            }
            var origFetch = window.fetch;
            window.fetch = function (input) {
                var url = (typeof input === "string" ? input : (input && input.url) || "").split("?")[0].split("/").pop();
                var started = Date.now();
                return origFetch.apply(this, arguments).then(function (r) {
                    if (!r.ok) { __rrLog(url + " " + r.status, true); return r; }
                    var total = +(r.headers.get("content-length") || 0);
                    var enc = r.headers.get("content-encoding");
                    if (!r.body || typeof ReadableStream !== "function") {
                        __rrLog(url + " 开始下载" + (total ? "（" + kb(total) + "）" : ""));
                        return r;
                    }
                    var d = downloads[url] = { got: 0, total: total, done: false };
                    var reader = r.body.getReader();
                    var counted = new ReadableStream({
                        pull: function (ctl) {
                            return reader.read().then(function (x) {
                                if (x.done) {
                                    d.done = true; progressLine();
                                    __rrLog(url.slice(0, 16) + " 下载完成 " + kb(d.got) + (enc ? "（" + enc + " 压缩）" : "") +
                                        "，用时 " + ((Date.now() - started) / 1000).toFixed(1) + " 秒");
                                    ctl.close(); return;
                                }
                                d.got += x.value.byteLength; progressLine(); render();
                                ctl.enqueue(x.value);
                            }, function (err) { __rrLog("下载中断 " + url + ": " + err, true); ctl.error(err); });
                        }
                    });
                    return new Response(counted, { status: r.status, statusText: r.statusText, headers: r.headers });
                }, function (err) { __rrLog("下载失败 " + url + ": " + err, true); throw err; });
            };
            var timer = setInterval(function () {
                if (!el("loading")) { clearInterval(timer); return; }
                render();
                if (Date.now() - t0 > 20000 && el("slow")) el("slow").style.display = "block";
            }, 500);
            // ?js=1 forces the JS build (as if the browser had no WasmGC), to compare the two builds
            if (/[?&]js=1/.test(location.search) && typeof WebAssembly === "object") {
                WebAssembly.validate = function () { return false; };
                __rrLog("已强制使用 JS 版");
            }
            var origError = console.error;
            console.error = function () {
                __rrLog("控制台错误: " + Array.prototype.map.call(arguments, String).join(" ").slice(0, 200), true);
                return origError.apply(console, arguments);
            };
            // report WebAssembly compiles: a large module can take very long in some in-app browsers
            if (typeof WebAssembly === "object") {
                ["instantiateStreaming", "compileStreaming", "instantiate", "compile"].forEach(function (fn) {
                    var orig = WebAssembly[fn];
                    if (!orig) return;
                    WebAssembly[fn] = function () {
                        var started = Date.now(), n = ++window.__rrWasmCount;
                        __rrLog("编译 Wasm #" + n + "（" + fn + "）开始");
                        return orig.apply(WebAssembly, arguments).then(function (r) {
                            __rrLog("编译 Wasm #" + n + " 完成（" + ((Date.now() - started) / 1000).toFixed(1) + " 秒）");
                            return r;
                        }, function (err) { __rrLog("编译 Wasm #" + n + " 失败: " + err, true); throw err; });
                    };
                });
                window.__rrWasmCount = 0;
            }
            // the app calls this after its first frame
            window.__rrReady = function () {
                booted = true;
                __rrLog("第一帧已绘制");
                var l = el("loading"); if (l) l.remove();
            };
            var ua = navigator.userAgent.match(/(iPhone OS [\d_]+|Android [\d.]+|Version\/[\d.]+|Chrome\/\d+|MicroMessenger\/[\d.]+|discover\/[\d.]+|Safari\/[\d.]+)/g);
            __rrLog((ua || []).join(" ") + (navigator.deviceMemory ? "，内存 " + navigator.deviceMemory + " GB" : ""));
            __rrLog("WebAssembly: " + (typeof WebAssembly === "object" ? "支持" : "不支持"));
            if (prev && !prev.ready && prev.lines && prev.lines.length) {
                lines.push('<span class="err">上次打开没有完成，停在：' + prev.lines[prev.lines.length - 1] + "</span>");
                window.__rrPrev = prev;
            }
        })();
    </script>
</head>
<body>
    <div id="loading">
        <b>River Runner 加载中…</b>
        <div>已等待 <span id="secs">0</span> 秒，第一次打开需要下载约 10 MB，之后会快很多</div>
        <div id="slow" style="display:none">加载较慢，可能是网络连不上 GitHub，可以换个网络或稍后再试</div>
        <div id="diag"></div>
    </div>
    <!-- after the body exists: the app attaches to it -->
    <script type="application/javascript" src="riverRunner.js"
            onload="__rrLog('启动脚本已加载')"></script>
</body>
</html>
